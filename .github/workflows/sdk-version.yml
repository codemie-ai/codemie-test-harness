name: Automated codemie-sdk version

on:
  issue_comment:
    types:
      - created
  schedule:
    - cron: '24 5 * * *' # 05:24 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: automated/codemie-sdk-version
  PACKAGE: codemie-sdk-python

jobs:
  sdk-version:
    name: codemie-sdk version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Never on a fork: it has no secrets, so the job could only fail.
    # On issue_comment, run only for a "/rerun" comment on the bot's PR.
    if: >-
      github.repository_owner == 'codemie-ai' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.issue.title, 'chore(deps): bump codemie-sdk-python') && contains(github.event.comment.body, '/rerun') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))

    steps:
      # author_association above is only a cheap pre-filter: MEMBER and
      # COLLABORATOR do not imply write access. A failed lookup fails the job.
      - name: Require write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq '.permission')
          echo "Permission of ${COMMENTER}: ${permission}"
          case "$permission" in
            admin|write) ;;
            *)
              echo "::error::${COMMENTER} needs write access to run this workflow"
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PAT, not GITHUB_TOKEN: a PR created with GITHUB_TOKEN does not trigger CI.
          # The push below reuses this token, so the bot PR gets its checks.
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.1.3

      - name: Get latest version from PyPI
        id: latest
        run: |
          latest=$(curl -fsS "https://pypi.org/pypi/${PACKAGE}/json" | jq -r '.info.version')
          current=$(sed -nE 's/^codemie-sdk-python = "([^"]+)"$/\1/p' pyproject.toml)
          if [[ -z "$latest" || "$latest" == "null" || -z "$current" ]]; then
            echo "::error::Could not resolve versions (latest='${latest}', current='${current}')"
            exit 1
          fi
          echo "Current: ${current}, latest: ${latest}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Bump version and refresh lock file
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          sed -i -E "s/^(codemie-sdk-python = )\"[^\"]+\"$/\1\"${LATEST}\"/" pyproject.toml
          poetry lock
          echo "Bump ${PACKAGE} to ${LATEST}" > .github/pr_body.log

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- pyproject.toml poetry.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to branch
        if: steps.changes.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pyproject.toml poetry.lock
          git commit -m "chore(deps): bump ${PACKAGE} to ${LATEST}"
          git push origin "$BRANCH" --force

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          title="chore(deps): bump ${PACKAGE} to ${LATEST}"
          if [[ $(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true) != "OPEN" ]]; then
            gh pr create \
              --head "$BRANCH" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "$title" \
              --body-file .github/pr_body.log
          else
            gh pr edit "$BRANCH" --title "$title" --body-file .github/pr_body.log
          fi

      - name: Close stale pull request
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr list --head "$BRANCH" --json number --jq '.[].number' | xargs -rn1 gh pr close --delete-branch
