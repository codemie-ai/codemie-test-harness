name: CodeQL

on:
  schedule:
    - cron: '37 1 * * 0'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    uses: codemie-ai/ci-workflows/.github/workflows/reusable-codeql.yml@f1a54987d56e2ee08192eb34d2e295451f0071ac # ci-workflows main 2026-10-29 (v0.1.0 has no reusable workflows)
    with:
      language: ${{ matrix.language }}
