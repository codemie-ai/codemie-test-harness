name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-title:
    name: PR Title
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-commit-lint.yml@f1a54987d56e2ee08192eb34d2e295451f0071ac # ci-workflows main 2026-10-29 (v0.1.0 has no reusable workflows)
