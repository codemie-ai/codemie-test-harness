[tool.poetry]
name = "codemie-test-harness"
version = "1.0.0"
description = "Autotest for CodeMie backend and UI"
authors = [
    "CodeMie Test Harness Team",
]
readme = "README.md"
license = "Apache-2.0"
packages = [
    { include = "codemie_test_harness" }
]

[tool.poetry.dependencies]
python = "^3.12"
codemie-sdk-python = "0.1.705"
pytest = "^8.4.1"
python-dotenv = "^1.1.0"
PyHamcrest = "^2.1.0"
pytest-xdist = "^3.6.1"
pytest-rerunfailures = "^15.1"
pytest-repeat = "^0.9.3"
pytest-timeout = "^2.4.0"
python-gitlab = "^5.6.0"
boto3 = "^1.39.8"
aws-assume-role-lib = "^2.10.0"
pyyaml = "^6.0.2"
pillow = "^13.0.0"
codemie-plugins = "^0.1.123"
pytest-reportportal = "^5.5.2"
pytest-playwright = "^0.8.0"
playwright = "^1.61.0"
tzlocal = "^5.3.1"
click = "^8.1.7"
questionary = "^2.1.0"
rich = "^14.0.0"
msal = "^1.31.1"
pandas = "^2.3.3"
python-docx = "^1.2.0"
pypdf = "^6.1.0"
filelock = "^3.16"
# Imported by codemie_test_harness/otlp_builder.py.
opentelemetry-proto = "^1.45.1"
protobuf = ">=5.0,<8.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.3"
pytest-cov = "^6.0.0"
pip-licenses = "^5.5.0"

[tool.poetry.scripts]
codemie-test-harness = "codemie_test_harness.cli.cli:cli"

[tool.pip-licenses]
ignore-packages = [
    "text-unidecode", # dual Artistic/GPL, used under Artistic
    "codemie-plugins", # no licence declared (proprietary EPAM package);
    "langchain-mcp-adapters", # UNKNOWN, it is MIT License upstream
    "codemie-sdk-python", # UNKNOWN when installed editable from this repo (Apache-2.0)
    "tiktoken", # MIT License (full text reported as the licence string)
]
allow-only = """
    3-Clause BSD License;\
    Apache 2.0;\
    Apache Software License;\
    Apache Software License; BSD License;\
    Apache Software License; MIT License;\
    Apache-2.0;\
    Apache-2.0 AND BSD-2-Clause;\
    Apache-2.0 AND MIT;\
    Apache-2.0 OR BSD-3-Clause;\
    Apache-2.0 OR MIT;\
    BSD 3-Clause OR Apache-2.0;\
    BSD License;\
    BSD;\
    BSD-2-Clause;\
    BSD-2-Clause AND Apache-2.0 WITH LLVM-exception;\
    BSD-3-Clause;\
    BSD-3-Clause, Apache-2.0, dependency licenses;\
    GNU Lesser General Public License v2 or later (LGPLv2+);\
    GNU Lesser General Public License v3 (LGPLv3);\
    GNU Lesser General Public License v3 or later (LGPLv3+);\
    LGPLv3+;\
    GNU Library or Lesser General Public License (LGPL);\
    ISC License (ISCL);\
    LGPL-3.0-only;\
    MIT;\
    MIT AND PSF-2.0;\
    MIT License;\
    MIT License; Mozilla Public License 2.0 (MPL 2.0);\
    MIT-CMU;\
    Mozilla Public License 2.0 (MPL 2.0);\
    PSF-2.0;\
    Python Software Foundation License;\
    Simplified BSD;\
    MPL-2.0 AND (Apache-2.0 OR MIT);\
    MPL-2.0 AND MIT;\
    MPL-2.0;\
    ISC;\
    MIT AND Python-2.0;\
    Apache License 2.0;\
    BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;\
    DFSG approved; MIT License;\
    Apache-2.0 AND CNRI-Python;\
    Apache 2.0.;\
"""

[tool.pytest.ini_options]
testpaths = ["codemie_test_harness/tests"]
addopts = "-v"
timeout = 300
timeout_method = "signal"
timeout_func_only = true
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
markers = [
    "sanity: Sanity check tests for CI/CD pipelines",
    "smoke: Quick smoke tests for local development",
    "api: API integration tests",
    "ui: UI tests with Playwright",
    "enterprise: Enterprise-only features",
    "skill: Skills functionality tests",
    "budget: Budget and spending tests",
    "user: User management admin API tests",
    "cli_analytics: CLI Analytics tests",
    "project: Project management tests",
    "prod_regression: UI tests safe to run on PROD (regular user or admin, not a maintainer)",
    "requires_capability(name): needs a /v1/config capability, skipped in gated runs when absent",
    "requires_setting(KEY): needs a harness setting, skipped in gated runs when unset",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
